<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visualização e cálculo de contas financeiras">
  <title>Cashly Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contas Financeiras</h1>

    <nav aria-label="Navegação principal">
      <a href="#inicio">Início</a>
      <a href="#contas">Extrato</a>
      <a href="#calculo">Métas</a>
	  <a href="#calculo">Insights</a>
    </nav>
  </header>

  <main id="inicio">
    <section id="contas">
      <h2>Visualização de Contas</h2>
      <div id="lista-contas">
        <p>Nenhuma conta cadastrada.</p>
      </div>
    </section>

    <section id="calculo">
      <h2>Cálculo Financeiro</h2>

      <form class="formulario">
        <div class="campo">
          <label for="valor">Valor</label>
          <input type="number" id="valor" name="valor" placeholder="0,00" step="0.01">
        </div>

        <div class="campo">
          <label for="tipo">Tipo de cálculo</label>
          <select id="tipo" name="tipo">
            <option value="">Selecione uma opção</option>
            <option value="juros">Juros</option>
            <option value="parcelas">Parcelas</option>
            <option value="desconto">Desconto</option>
          </select>
        </div>

        <button type="submit">Calcular</button>
      </form>

      <div id="resultado">
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cashly</p>
  </footer>

</body>
</html>
